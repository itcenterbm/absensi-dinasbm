<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>E-ABSENSI GURU SMA-BM</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    body { background-color: #f4f6f9; color: #1e293b; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
    .card-dark { background-color: #1e293b; border: 1px solid #334155; color: #f8fafc; }
    #webcamVideo { width: 100%; max-width: 320px; max-height: 32vh; object-fit: cover; border-radius: 16px; background: #000; transform: scaleX(-1); border: 2px solid #3b82f6; }
    #canvasFoto { display: none; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background-color: #1e293b; border-top: 1px solid #334155; display: flex; justify-content: space-around; align-items: center; z-index: 1050; }
    .bottom-nav-item { display: flex; flex-direction: column; align-items: center; color: #94a3b8; text-decoration: none; font-size: 0.72rem; font-weight: 600; flex: 1; cursor: pointer; }
    .bottom-nav-item i { font-size: 1.25rem; margin-bottom: 3px; }
    .bottom-nav-item.active { color: #3b82f6; }
    @media (max-width: 767.98px) { .main-content { padding: 12px 12px 80px 12px !important; } }
  </style>
</head>
<body>

<!-- LOGIN GURU -->
<div id="sectionLogin" class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-6 col-lg-4">
      <div class="card card-dark shadow-lg rounded-4 p-4">
        <div class="text-center mb-4">
          <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-2" style="width: 60px; height: 60px;">
            <i class="fas fa-user-tie fa-2x"></i>
          </div>
          <h4 class="fw-bold">E-ABSENSI GURU</h4>
          <p class="text-white small">Presensi Dinas SMA-BM  </p>
        </div>
        <form id="formLogin" onsubmit="prosesLogin(event)">
          <div class="mb-3">
            <label class="form-label fw-semibold">USERNAME / NUPTK</label>
            <input type="text" id="loginUser" class="form-control bg-dark text-white border-secondary" required placeholder="Masukkan username">
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">PASSWORD</label>
            <input type="password" id="loginPass" class="form-control bg-dark text-white border-secondary" required placeholder="Masukkan password">
          </div>
          <button type="submit" id="btnSubmitLogin" class="btn btn-primary w-100 btn-lg fw-bold rounded-3">
            <i class="fas fa-sign-in-alt me-2"></i> Masuk
          </button>
        </form>
        <div class="text-center mt-4">
        <small class="text-white small">&copy; 2026 Absensi SMA-BM</small>
      </div>
      </div>
    </div>
  </div>
</div>

<!-- APP CONTAINER GURU -->
<div id="sectionMainApp" class="d-none">
  <div class="container-fluid main-content p-3">
    
    <!-- PAGE PRESENSI KAMERA -->
    <div id="pageAbsenGuru" class="page-content d-none">
      <div class="row justify-content-center">
        <div class="col-12 col-md-6 text-center">
          <div class="card card-dark shadow-sm p-3 rounded-4">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <span class="badge bg-primary">GURU</span>
              <small class="text-muted fw-bold txtNamaUser">-</small>
            </div>
            <div class="d-flex justify-content-center">
              <video id="webcamVideo" autoplay playsinline></video>
            </div>
            <canvas id="canvasFoto"></canvas>
            <div class="status-gps-box my-2" id="txtStatusGPS">
              <span class="text-muted"><i class="fas fa-spinner fa-spin me-1"></i> Mendeteksi Lokasi GPS...</span>
            </div>
            <div class="row g-2 justify-content-center">
              <div class="col-6">
                <button class="btn btn-success w-100 py-2 rounded-3 fw-bold" onclick="eksekusiAbsen('CHECK_IN')"><i class="fas fa-sign-in-alt me-1"></i> Check-In</button>
              </div>
              <div class="col-6">
                <button class="btn btn-warning text-white w-100 py-2 rounded-3 fw-bold" onclick="eksekusiAbsen('CHECK_OUT')"><i class="fas fa-sign-out-alt me-1"></i> Check-Out</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- PAGE RIWAYAT PRESENSI -->
    <div id="pageRiwayatGuru" class="page-content d-none">
      <div class="card card-dark shadow-sm p-3 rounded-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
          <h6 class="fw-bold mb-0"><i class="fas fa-history text-primary me-2"></i>Riwayat Saya</h6>
          <div class="d-flex gap-2">
            <input type="month" id="filterBulanGuru" class="form-control form-control-sm bg-dark text-white border-secondary" onchange="muatRiwayatGuru()">
            <button class="btn btn-success btn-sm fw-bold" onclick="downloadRiwayatGuruExcel()"><i class="fas fa-file-excel"></i></button>
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-dark table-hover align-middle">
            <thead>
              <tr><th>Tanggal</th><th>Tipe</th><th>Jam</th><th>Status</th><th>Foto</th></tr>
            </thead>
            <tbody id="tbRiwayatGuru"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- PAGE AKUN / PROFIL -->
    <div id="pageAkunGuru" class="page-content d-none">
      <div class="row justify-content-center">
        <div class="col-12 col-md-6 text-center">
          <div class="card card-dark p-4 rounded-4 shadow-sm">
            <h5 class="fw-bold text-white txtNamaUser">-</h5>
            <p class="text-muted small mb-3 txtRoleUser">Guru</p>
            <ul class="list-group list-group-flush text-start mb-4">
              <li class="list-group-item bg-transparent text-white border-secondary d-flex justify-content-between"><span>NIP:</span> <strong id="txtProfileNip">-</strong></li>
              <li class="list-group-item bg-transparent text-white border-secondary d-flex justify-content-between"><span>Mapel:</span> <strong id="txtProfileMapel">-</strong></li>
            </ul>
            <button class="btn btn-danger w-100 fw-bold" onclick="prosesLogout()"><i class="fas fa-sign-out-alt me-2"></i> Keluar</button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">
    <a class="bottom-nav-item nav-absenGuru" onclick="navigasi('absenGuru')"><i class="fas fa-camera"></i><span>Presensi</span></a>
    <a class="bottom-nav-item nav-riwayatGuru" onclick="navigasi('riwayatGuru')"><i class="fas fa-history"></i><span>Riwayat</span></a>
    <a class="bottom-nav-item nav-akunGuru" onclick="navigasi('akunGuru')"><i class="fas fa-user"></i><span>Akun</span></a>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbzXKROJIToOSQZzTZ5z5wDC-DgO4kLsIT71j9FCLZesd3M867SAQATmQirzdu2xWNWa/exec";
  let currentUser = null, userCoords = null, videoStream = null, currentRiwayatGuruData = [];

  $(document).ready(function() {
    $('#filterBulanGuru').val(new Date().toISOString().substring(0, 7));
    let savedUser = localStorage.getItem('user_presensi_guru');
    if (savedUser) {
      currentUser = JSON.parse(savedUser);
      bukaAplikasi();
    }
  });

  function apiPost(payload) {
    return $.ajax({ url: API_URL, type: "POST", data: JSON.stringify(payload), contentType: "text/plain;charset=utf-8", timeout: 20000 });
  }

  function apiGet(param) {
    return $.ajax({ url: API_URL + "?" + param, type: "GET", dataType: "json", timeout: 15000 });
  }

  function prosesLogin(e) {
    e.preventDefault();
    $('#btnSubmitLogin').prop('disabled', true).html('<i class="fas fa-spinner fa-spin me-2"></i> Memproses...');
    
    apiPost({ action: "login", payload: { username: $('#loginUser').val(), password: $('#loginPass').val() } })
    .done(function(res) {
      $('#btnSubmitLogin').prop('disabled', false).html('<i class="fas fa-sign-in-alt me-2"></i> Masuk');
      if (res.status === "BERHASIL") {
        if(res.user.role.toLowerCase() === 'admin') {
          Swal.fire('Akses Ditolak', 'Gunakan portal khusus Admin untuk login.', 'warning');
          return;
        }
        currentUser = res.user;
        localStorage.setItem('user_presensi_guru', JSON.stringify(currentUser));
        bukaAplikasi();
      } else { Swal.fire('Gagal', res.pesan, 'error'); }
    }).fail(function() {
      $('#btnSubmitLogin').prop('disabled', false).html('<i class="fas fa-sign-in-alt me-2"></i> Masuk');
      Swal.fire('Error', 'Koneksi lambat, coba lagi.', 'warning');
    });
  }

  function bukaAplikasi() {
    $('#sectionLogin').addClass('d-none');
    $('#sectionMainApp').removeClass('d-none');
    $('.txtNamaUser').text(currentUser.nama);
    $('#txtProfileNip').text(currentUser.nip || '-');
    $('#txtProfileMapel').text(currentUser.mapel || '-');
    navigasi('absenGuru');
  }

  function prosesLogout() {
    localStorage.removeItem('user_presensi_guru');
    matikanKamera();
    location.reload();
  }

  function navigasi(page) {
    $('.page-content').addClass('d-none');
    $('.bottom-nav-item').removeClass('active');
    $('.nav-' + page).addClass('active');

    if (page === 'absenGuru') { $('#pageAbsenGuru').removeClass('d-none'); nyalakanKamera(); mintaGPS(); }
    else if (page === 'riwayatGuru') { $('#pageRiwayatGuru').removeClass('d-none'); muatRiwayatGuru(); matikanKamera(); }
    else if (page === 'akunGuru') { $('#pageAkunGuru').removeClass('d-none'); matikanKamera(); }
  }

  function nyalakanKamera() {
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } }).then(function(stream) {
        videoStream = stream;
        document.getElementById('webcamVideo').srcObject = stream;
      }).catch(err => console.warn(err));
    }
  }

  function matikanKamera() {
    if (videoStream) { videoStream.getTracks().forEach(t => t.stop()); videoStream = null; }
  }

  function mintaGPS() {
    $('#txtStatusGPS').html('<span class="text-warning"><i class="fas fa-spinner fa-spin me-1"></i> Mencari GPS...</span>');
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(function(pos) {
        userCoords = pos.coords.latitude.toFixed(6) + "," + pos.coords.longitude.toFixed(6);
        $('#txtStatusGPS').html('<span class="text-success"><i class="fas fa-check-circle me-1"></i> Lokasi Siap</span>');
      }, function() {
        $('#txtStatusGPS').html('<span class="text-danger"><i class="fas fa-times-circle me-1"></i> GPS Matikan/Gagal</span>');
      }, { enableHighAccuracy: true, timeout: 8000 });
    }
  }

  function eksekusiAbsen(tipe) {
    if (!userCoords) { Swal.fire('Gagal', 'GPS belum terdeteksi.', 'warning'); return; }
    let video = document.getElementById('webcamVideo');
    let canvas = document.getElementById('canvasFoto');
    let context = canvas.getContext('2d');
    canvas.width = video.videoWidth || 320;
    canvas.height = video.videoHeight || 240;
    context.translate(canvas.width, 0); context.scale(-1, 1);
    context.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    Swal.fire({ title: 'Mengirim Absen...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
    apiPost({
      action: "simpanAbsen",
      payload: { nip: currentUser.nip, nama: currentUser.nama, tipe: tipe, lokasi: userCoords, fotoBase64: canvas.toDataURL('image/jpeg', 0.5) }
    }).done(function(res) {
      Swal.close();
      if (res.status === "BERHASIL") Swal.fire('Berhasil!', res.pesan, 'success');
      else Swal.fire('Gagal', res.pesan, 'error');
    });
  }

  function muatRiwayatGuru() {
    let bulan = $('#filterBulanGuru').val() || new Date().toISOString().substring(0, 7);
    $('#tbRiwayatGuru').html('<tr><td colspan="5" class="text-center py-3"><i class="fas fa-spinner fa-spin me-2"></i> Memuat...</td></tr>');
    apiGet("action=getRiwayatGuru&nip=" + currentUser.nip + "&bulan=" + bulan).done(function(res) {
      let data = res.data || res; currentRiwayatGuruData = data;
      let html = '';
      if (!data || data.length === 0) html = '<tr><td colspan="5" class="text-center text-muted">Tidak ada data.</td></tr>';
      else {
        data.forEach(function(r) {
          let badgeKet = '<span class="badge bg-success">' + (r.keterangan || 'TEPAT WAKTU') + '</span>';
          if (r.keterangan && r.keterangan.includes('TERLAMBAT')) badgeKet = '<span class="badge bg-warning text-dark">' + r.keterangan + '</span>';
          html += `<tr><td>${r.tanggal}</td><td><span class="badge ${r.tipe === 'CHECK_IN' ? 'bg-primary' : 'bg-warning text-dark'}">${r.tipe}</span></td><td>${r.jam}</td><td>${badgeKet}</td><td>${r.foto ? `<a href="${r.foto}" target="_blank" class="btn btn-sm btn-outline-info"><i class="fas fa-image"></i></a>` : '-'}</td></tr>`;
        });
      }
      $('#tbRiwayatGuru').html(html);
    });
  }

  function downloadRiwayatGuruExcel() {
    if (!currentRiwayatGuruData.length) return Swal.fire('Kosong', 'Data tidak ada.', 'warning');
    let worksheet = XLSX.utils.json_to_sheet(currentRiwayatGuruData);
    let workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "Riwayat");
    XLSX.writeFile(workbook, `Riwayat_${currentUser.nip}.xlsx`);
  }
</script>
</body>
</html>
